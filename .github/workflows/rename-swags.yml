# One-time workflow: rename the uploaded SWAGS file to swags.html.
# Runs only when started manually. Delete this file after it runs.
name: One-time rename of SWAGS file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename swags-members-club.html to swags.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv swags-members-club.html swags.html
          git commit -m "Rename SWAGS site to swags.html"
          git push
