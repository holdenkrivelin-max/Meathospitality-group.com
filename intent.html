<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTENT — MEAT Hospitality Group</title>
<link rel="canonical" href="https://meathospitalitygroup.com/intent">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #10234d;
    color: #f2f7ff;
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .wrap { max-width: 760px; }
  .kicker {
    font-family: 'Jost', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: .25em;
    color: #63d7ff;
    text-transform: uppercase;
    margin-bottom: 48px;
  }
  h1 {
    font-size: clamp(72px, 14vw, 150px);
    font-weight: 700;
    letter-spacing: .07em;
    margin-bottom: 32px;
    color: #f2f7ff;
  }
  .tagline {
    font-size: clamp(20px, 3.5vw, 28px);
    font-style: italic;
    color: #f2f7ff;
    margin-bottom: 16px;
  }
  .yours {
    font-family: 'Jost', Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #63d7ff;
    margin-bottom: 64px;
  }
  .divider {
    width: 120px;
    height: 1px;
    background: #63d7ff;
    margin: 0 auto 64px;
  }
  .coming {
    font-family: 'Jost', Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #dbe9fc;
  }
  .foot {
    margin-top: 80px;
    font-family: 'Jost', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c0d2ec;
  }
</style>
</head>
<body>
  <main id="intent" class="wrap" aria-labelledby="intent-title">
    <div class="kicker">Meat Hospitality Group presents</div>
    <h1 id="intent-title">INTENT</h1>
    <div class="tagline">Your accountability partner.</div>
    <div class="yours">Completely yours</div>
    <div class="divider"></div>
    <div class="coming">Something big is coming</div>
    <div class="foot">This has never felt more yours</div>
  </main>
</body>
</html>
